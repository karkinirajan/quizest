[project]
name = "quizest"
version = "1.0.0"
description = "Django app for uploading and managing course/quiz packages, with sign-up, Google login and a themed admin."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-allauth>=65",
    "django-jazzmin>=3.0",
    "django-crispy-forms>=2.7,<3",
    "crispy-bootstrap5>=2026.3",
    "requests>=2.32",
    "pillow>=13,<14",
    "whitenoise>=6.12,<7",
    "dj-database-url>=3.1,<4",
    "gunicorn>=26,<27",
    "psycopg[binary]>=3.3,<4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.9", "ruff>=0.8"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "courseapp.settings_test"
python_files = ["test_*.py"]
testpaths = ["course"]

[tool.ruff]
line-length = 100
extend-exclude = ["*/migrations", "static", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ"]
